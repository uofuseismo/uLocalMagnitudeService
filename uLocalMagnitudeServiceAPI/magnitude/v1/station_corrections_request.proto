edition = "2023";

package ULocalMagnitudeServiceAPI.Magnitude.V1;

import "uLocalMagnitudeServiceAPI/magnitude/v1/station_identifier.proto";

/**
 * This extracts the station corrections from the service.
 * This is a debugging utility.
 */
message StationCorrectionsRequest {
  /// A request identifier.
  string identifier = 1 [default = ""];
  /// The stations to query for corrections. 
  repeated StationIdentifier station_identifiers = 2;
}
