edition = "2023";
import "google/protobuf/timestamp.proto";

package ULocalMagnitudeServiceAPI.WaveformProcessing.V1;

import "uLocalMagnitudeServiceAPI/waveformProcessing/v1/data_type.proto";

/**
 * A packet is a set of samples that help to define a waveform.
 */
message Packet {
   /// The packet's start time in UTC.
   google.protobuf.Timestamp start_time = 1;
   /// The sampling rate in Hz.  This must be positive.
   double sampling_rate = 2;
   /// The data type.
   DataType data_type = 3;
   /// The number of samples.
   uint32 number_of_samples = 4;
   /// The data.  This is stored in little endian.
   bytes data = 5;
}
