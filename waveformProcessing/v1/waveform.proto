edition = "2023";

package ULocalMagnitudeServiceAPI.WaveformProcessing.V1;

import "uLocalMagnitudeServiceAPI/waveformProcessing/v1/packet.proto";
import "uLocalMagnitudeServiceAPI/waveformProcessing/v1/stream_identifier.proto";

/**
 * A waveform is a collection of data packets.
 */
message Waveform {
   /// The stream identifier
   StreamIdentifier stream_identifier = 1;
   /// The packets defining the waveform.  These are sorted by increasing start time.
   repeated Packet packets = 2;
}
